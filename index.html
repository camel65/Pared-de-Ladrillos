<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pared de Ladrillos B&W</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        /* Botón de Inicio */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #000000;
            background: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #000000;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
            transform: scale(1.08);
        }

        /* Controles flotantes */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.05);
        }

        /* Contenedor del lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Botón de Inicio -->
    <button id="btn-inicio">Inicio</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="paredCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('paredCanvas');
        const ctx = canvas.getContext('2d');

        let animacionId = null;
        let activo = false;

        // Configuración de la pared
        const altoLadrillo = 28;
        const anchoLadrillo = 60;
        let columnas = 0;
        let filas = 0;

        let ladrillosConstruidos = [];
        let fragmentosExplosion = [];
        let estado = 'construyendo'; // 'construyendo' o 'explotando'
        let indiceFilaActual = 0;
        let indiceColumnaActual = 0;
        let temporizadorLadrillo = 0;

        // Variables de Audio (Volumen Máximo + Compresor)
        let audioCtx = null;
        let audioActivo = true;
        let masterGain = null;
        let compresor = null;

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columnas = Math.ceil(canvas.width / anchoLadrillo) + 1;
            filas = Math.ceil(canvas.height / altoLadrillo);
        }

        window.addEventListener('resize', () => {
            if (activo) {
                ajustarCanvas();
                reiniciarConstruccion();
            }
        });

        // --- SISTEMA DE AUDIO (Impactos y Explosión) ---
        function sonidoLadrillo() {
            if (!audioActivo || !audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180 + Math.random() * 40, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.04);

            gain.gain.setValueAtTime(0.8, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

            osc.connect(gain);
            gain.connect(compresor);
            osc.start(t);
            osc.stop(t + 0.06);
        }

        function sonidoExplosion() {
            if (!audioActivo || !audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;

            // Ruido blanco/grave para impacto
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filtro = audioCtx.createBiquadFilter();
            filtro.type = 'lowpass';
            filtro.frequency.setValueAtTime(400, t);
            filtro.frequency.exponentialRampToValueAtTime(30, t + 0.4);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

            noise.connect(filtro);
            filtro.connect(gain);
            gain.connect(compresor);

            noise.start(t);
            noise.stop(t + 0.41);
        }

        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);

            compresor = audioCtx.createDynamicsCompressor();
            compresor.threshold.setValueAtTime(-12, audioCtx.currentTime);
            compresor.ratio.setValueAtTime(12, audioCtx.currentTime);

            compresor.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }

        btnAudio.addEventListener('click', () => {
            audioActivo = !audioActivo;
            btnAudio.textContent = audioActivo ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);
            }
        });

        // --- LÓGICA DE LA PARED Y EXPLOSIÓN ---
        function reiniciarConstruccion() {
            ladrillosConstruidos = [];
            fragmentosExplosion = [];
            estado = 'construyendo';
            indiceFilaActual = 0;
            indiceColumnaActual = 0;
            temporizadorLadrillo = 0;
        }

        function colocarSiguienteLadrillo() {
            // Posición Y de abajo hacia arriba
            let y = canvas.height - (indiceFilaActual + 1) * altoLadrillo;

            // Desfase en filas pares para crear el patrón de pared real
            let desfase = (indiceFilaActual % 2 === 1) ? -anchoLadrillo / 2 : 0;
            let x = indiceColumnaActual * anchoLadrillo + desfase;

            ladrillosConstruidos.push({
                x: x,
                y: y,
                w: anchoLadrillo - 2, // Pequeño margen para la junta de mortero
                h: altoLadrillo - 2
            });

            sonidoLadrillo();

            // Avanzar columna
            indiceColumnaActual++;
            if (indiceColumnaActual >= columnas) {
                indiceColumnaActual = 0;
                indiceFilaActual++; // Subir de fila
            }

            // ¿Pared completa?
            if (indiceFilaActual >= filas) {
                desatarExplosion();
            }
        }

        function desatarExplosion() {
            estado = 'explotando';
            fragmentosExplosion = [];

            // Convertir cada ladrillo en un fragmento con física
            ladrillosConstruidos.forEach(l => {
                let centroX = canvas.width / 2;
                let centroY = canvas.height / 2;

                // Calcular dirección alejándose del centro
                let dx = (l.x + l.w / 2) - centroX;
                let dy = (l.y + l.h / 2) - centroY;
                let dist = Math.hypot(dx, dy) || 1;

                let fuerza = Math.random() * 15 + 8;

                fragmentosExplosion.push({
                    x: l.x,
                    y: l.y,
                    w: l.w,
                    h: l.h,
                    vx: (dx / dist) * fuerza + (Math.random() - 0.5) * 6,
                    vy: (dy / dist) * fuerza + (Math.random() - 0.5) * 6,
                    angulo: 0,
                    vRotacion: (Math.random() - 0.5) * 0.3,
                    opacidad: 1.0
                });
            });

            ladrillosConstruidos = [];
            sonidoExplosion();
        }

        // --- CONTROLES DE LA PÁGINA ---
        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';

            ajustarCanvas();
            reiniciarConstruccion();
            activo = true;

            iniciarAudio();
            iniciarAnimacion();
        });

        btnSalir.addEventListener('click', () => {
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
        function iniciarAnimacion() {
            if (!activo) return;

            // Fondo negro absoluto
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (estado === 'construyendo') {
                // Controlar velocidad de construcción de ladrillos
                temporizadorLadrillo++;
                if (temporizadorLadrillo % 2 === 0) { // Colocar ladrillo cada 2 fotogramas (muy fluido y rápido)
                    colocarSiguienteLadrillo();
                }

                // Dibujar ladrillos colocados
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;

                for (let i = 0; i < ladrillosConstruidos.length; i++) {
                    let l = ladrillosConstruidos[i];
                    ctx.fillRect(l.x, l.y, l.w, l.h);
                    ctx.strokeRect(l.x, l.y, l.w, l.h);
                }

            } else if (estado === 'explotando') {
                let quedanFragmentos = false;

                for (let i = 0; i < fragmentosExplosion.length; i++) {
                    let f = fragmentosExplosion[i];

                    // Actualizar posición y rotación
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.2; // Leve gravedad
                    f.angulo += f.vRotacion;
                    f.opacidad -= 0.015;

                    if (f.opacidad > 0) {
                        quedanFragmentos = true;

                        ctx.save();
                        ctx.translate(f.x + f.w / 2, f.y + f.h / 2);
                        ctx.rotate(f.angulo);

                        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, f.opacidad)})`;
                        ctx.strokeStyle = `rgba(0, 0, 0, ${Math.max(0, f.opacidad)})`;
                        ctx.lineWidth = 1.5;

                        ctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
                        ctx.strokeRect(-f.w / 2, -f.h / 2, f.w, f.h);

                        ctx.restore();
                    }
                }

                // Si todos los fragmentos desaparecieron, reiniciar bucle de construcción
                if (!quedanFragmentos) {
                    reiniciarConstruccion();
                }
            }

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
